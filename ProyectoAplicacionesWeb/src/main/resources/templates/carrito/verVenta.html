<!DOCTYPE html>

<html
    xmlns:th="http://www.thymeleaf.org"
    lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <title>
        Compra realizada - Soporte TECH
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body class="bg-light">


<div class="container py-5">


    <div

        class="
            card
            border-0
            shadow
            rounded-4
            mx-auto
        "

        style="
            max-width:950px;
        ">


        <div
            class="
                card-body
                p-4
                p-md-5
            ">


            <!-- =========================== -->
            <!-- CONFIRMACIÓN -->
            <!-- =========================== -->

            <div
                class="
                    text-center
                    mb-4
                ">


                <i
                    class="
                        bi
                        bi-check-circle-fill
                        text-success
                        display-3
                    ">
                </i>


                <h2
                    class="
                        fw-bold
                        mt-3
                    ">

                    Compra procesada correctamente

                </h2>


                <p class="text-muted">

                    Venta #

                    <span
                        th:text="
                            ${venta.idVenta}
                        ">

                        0

                    </span>

                </p>

            </div>


            <!-- ============================= -->
            <!-- INFORMACIÓN DE LA VENTA -->
            <!-- ============================= -->

            <div
                class="
                    row
                    g-3
                    mb-4
                ">


                <!-- Cliente -->

                <div class="col-md-4">

                    <strong>
                        Cliente:
                    </strong>

                    <br>

                    <span
                        th:text="
                            ${venta.cliente.nombre
                            +
                            ' '
                            +
                            venta.cliente.apellidos}
                        ">

                        Cliente

                    </span>

                </div>


                <!-- Estado -->

                <div class="col-md-4">

                    <strong>
                        Estado:
                    </strong>

                    <br>

                    <span

                        class="
                            badge
                            bg-success
                        "

                        th:text="
                            ${venta.estado}
                        ">

                        Pagada

                    </span>

                </div>


                <!-- Total -->

                <div class="col-md-4">

                    <strong>
                        Total:
                    </strong>

                    <br>

                    <span

                        class="
                            fs-5
                            fw-bold
                            text-primary
                        "

                        th:text="
                            '₡'
                            +
                            ${#numbers.formatDecimal(
                                venta.total,
                                1,
                                'COMMA',
                                2,
                                'POINT'
                            )}
                        ">

                        ₡0.00

                    </span>

                </div>

            </div>


            <!-- ================================= -->
            <!-- DETALLE DE LA COMPRA -->
            <!-- ================================= -->

            <div class="table-responsive">


                <table
                    class="
                        table
                        align-middle
                    ">


                    <thead
                        class="table-light">

                    <tr>

                        <th>
                            Producto
                        </th>

                        <th>
                            Precio
                        </th>

                        <th class="text-center">
                            Cantidad
                        </th>

                        <th class="text-end">
                            Subtotal
                        </th>

                    </tr>

                    </thead>


                    <tbody>


                    <tr
                        th:each="
                            detalle :
                            ${venta.detalles}
                        ">


                        <!-- Producto -->

                        <td
                            th:text="
                                ${detalle.producto.nombre}
                            ">

                            Producto

                        </td>


                        <!-- Precio -->

                        <td
                            th:text="
                                '₡'
                                +
                                ${#numbers.formatDecimal(
                                    detalle.precio,
                                    1,
                                    'COMMA',
                                    2,
                                    'POINT'
                                )}
                            ">

                            ₡0.00

                        </td>


                        <!-- Cantidad -->

                        <td

                            class="text-center"

                            th:text="
                                ${detalle.cantidad}
                            ">

                            1

                        </td>


                        <!-- Subtotal -->

                        <td

                            class="text-end"

                            th:text="
                                '₡'
                                +
                                ${#numbers.formatDecimal(
                                    detalle.subtotal,
                                    1,
                                    'COMMA',
                                    2,
                                    'POINT'
                                )}
                            ">

                            ₡0.00

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>


            <!-- ============================== -->
            <!-- BOTONES -->
            <!-- ============================== -->

            <div
                class="
                    text-center
                    mt-4
                ">


                <a

                    th:href="
                        @{/producto/listado}
                    "

                    class="
                        btn
                        btn-primary
                        rounded-pill
                        px-4
                    ">


                    <i
                        class="
                            bi
                            bi-bag
                            me-1
                        ">
                    </i>

                    Volver a productos

                </a>


                <a

                    th:href="
                        @{/inicio}
                    "

                    class="
                        btn
                        btn-outline-secondary
                        rounded-pill
                        px-4
                        ms-2
                    ">

                    Menú principal

                </a>

            </div>

        </div>

    </div>

</div>
i
</body>

</html>
