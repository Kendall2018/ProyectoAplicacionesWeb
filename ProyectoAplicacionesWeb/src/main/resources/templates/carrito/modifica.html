<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
      lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>
        Modificar carrito - Soporte TECH
    </title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body class="bg-light">


<div class="container py-5">


    <!-- ======================================== -->
    <!-- VOLVER AL CARRITO -->
    <!-- ======================================== -->

    <a th:href="@{/carrito/listado}"
       class="btn btn-outline-secondary rounded-pill mb-4">

        <i class="bi bi-arrow-left me-1"></i>

        Volver al carrito

    </a>


    <!-- ======================================== -->
    <!-- TARJETA DEL PRODUCTO -->
    <!-- ======================================== -->

    <div class="card border-0 shadow-sm rounded-4 mx-auto"
         style="max-width:850px;">

        <div class="card-body p-4 p-md-5">

            <div class="row g-4 align-items-center">


                <!-- ======================================== -->
                <!-- IMAGEN DEL PRODUCTO -->
                <!-- ======================================== -->

                <div class="col-md-4 text-center">

                    <img
                        th:if="${item.producto.rutaImagen != null
                        and !#strings.isEmpty(item.producto.rutaImagen)}"

                        th:src="${item.producto.rutaImagen}"

                        th:alt="${item.producto.nombre}"

                        class="img-fluid rounded-4 border"

                        style="
                            max-height:260px;
                            object-fit:cover;
                        ">

                </div>


                <!-- ======================================== -->
                <!-- INFORMACIÓN DEL PRODUCTO -->
                <!-- ======================================== -->

                <div class="col-md-8">


                    <!-- Nombre -->

                    <h3 class="fw-bold"
                        th:text="${item.producto.nombre}">

                        Producto

                    </h3>


                    <!-- Descripción -->

                    <p class="text-muted"
                       th:text="${item.producto.descripcion}">

                        Descripción

                    </p>


                    <!-- Precio -->

                    <p class="mb-1">

                        Precio unitario:

                    </p>


                    <p class="fs-4 fw-bold text-primary"

                       th:text="
                            '₡'
                            +
                            ${#numbers.formatDecimal(
                                item.precio,
                                1,
                                'COMMA',
                                2,
                                'POINT'
                            )}
                       ">

                        ₡0.00

                    </p>


                    <!-- ======================================== -->
                    <!-- FORMULARIO MODIFICAR CANTIDAD -->
                    <!-- ======================================== -->

                    <form
                        th:action="@{/carrito/actualizar}"
                        method="post"
                        class="mt-4">


                        <!-- ==================================== -->
                        <!-- ID DEL PRODUCTO -->
                        <!-- IMPORTANTE: debe llamarse idProducto -->
                        <!-- ==================================== -->

                        <input
                            type="hidden"
                            name="idProducto"
                            th:value="${item.producto.idProducto}">


                        <!-- ==================================== -->
                        <!-- CANTIDAD -->
                        <!-- ==================================== -->

                        <label
                            for="cantidad"
                            class="form-label fw-semibold">

                            Cantidad

                        </label>


                        <div
                            class="input-group mb-2"
                            style="max-width:220px;">


                            <!-- RESTAR -->

                            <button
                                class="btn btn-outline-secondary"
                                type="button"
                                onclick="cambiarCantidad(-1)">

                                <i class="bi bi-dash-lg"></i>

                            </button>


                            <!-- CANTIDAD -->

                            <input
                                id="cantidad"
                                name="cantidad"
                                type="number"
                                class="form-control text-center"

                                th:value="${item.cantidad}"

                                min="1"

                                th:max="${item.producto.existencias}"

                                required>


                            <!-- SUMAR -->

                            <button
                                class="btn btn-outline-secondary"
                                type="button"
                                onclick="cambiarCantidad(1)">

                                <i class="bi bi-plus-lg"></i>

                            </button>

                        </div>


                        <!-- ==================================== -->
                        <!-- EXISTENCIAS -->
                        <!-- ==================================== -->

                        <small class="text-muted">

                            Disponibles:

                            <span th:text="${item.producto.existencias}">
                                0
                            </span>

                        </small>


                        <!-- ==================================== -->
                        <!-- BOTONES -->
                        <!-- ==================================== -->

                        <div class="mt-4 d-flex gap-2 flex-wrap">


                            <!-- GUARDAR -->

                            <button
                                class="btn btn-success rounded-pill px-4"
                                type="submit">

                                <i class="bi bi-check-circle me-1"></i>

                                Guardar cambios

                            </button>


                            <!-- CANCELAR -->

                            <a
                                th:href="@{/carrito/listado}"
                                class="btn btn-outline-secondary rounded-pill px-4">

                                Cancelar

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- ======================================== -->
<!-- CONTROL DE CANTIDAD -->
<!-- ======================================== -->

<script>

    function cambiarCantidad(delta) {

        const input =
                document.getElementById('cantidad');

        const actual =
                parseInt(
                    input.value || '1',
                    10
                );

        const minimo =
                parseInt(
                    input.min || '1',
                    10
                );

        const maximo =
                parseInt(
                    input.max || '999999',
                    10
                );


        const nuevaCantidad =
                Math.min(
                    maximo,
                    Math.max(
                        minimo,
                        actual + delta
                    )
                );


        input.value = nuevaCantidad;
    }

</script>


</body>

</html>
