<!DOCTYPE html>

<html
    xmlns:th="http://www.thymeleaf.org"
    lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <title>
        Nueva solicitud - Soporte TECH
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>


<nav class="navbar">

    <div class="container">

        <span class="navbar-brand">

            Soporte <strong>TECH</strong>

        </span>

        <a
            th:href="@{/inicio}"
            class="btn btn-light">

            Inicio

        </a>

    </div>

</nav>


<div class="container main-container">


    <div class="card soporte-card">


        <div class="card-header">

            <h2>
                Nueva solicitud de soporte
            </h2>

            <p>

                Describa el problema técnico
                que necesita resolver.

            </p>

        </div>


        <div class="card-body">


            <form
                th:action="@{/solicitud/guardar}"
                method="post">


                <!-- ================================= -->
                <!-- ASUNTO -->
                <!-- ================================= -->

                <div class="mb-4">

                    <label
                        for="asunto"
                        class="form-label">

                        Asunto

                    </label>

                    <input
                        type="text"
                        id="asunto"
                        name="asunto"
                        class="form-control"
                        maxlength="150"
                        placeholder="Ejemplo: Computadora no enciende"
                        required>

                </div>


                <!-- ================================= -->
                <!-- DESCRIPCION -->
                <!-- ================================= -->

                <div class="mb-4">

                    <label
                        for="descripcion"
                        class="form-label">

                        Descripción del problema

                    </label>

                    <textarea
                        id="descripcion"
                        name="descripcion"
                        class="form-control"
                        rows="6"
                        maxlength="500"
                        placeholder="Describa el problema con el mayor detalle posible..."
                        required>
                    </textarea>

                </div>


                <!-- ================================= -->
                <!-- PRIORIDAD -->
                <!-- ================================= -->

                <div class="mb-4">

                    <label
                        for="prioridad"
                        class="form-label">

                        Prioridad

                    </label>

                    <select
                        id="prioridad"
                        name="prioridad"
                        class="form-select"
                        required>


                        <option
                            value=""
                            selected
                            disabled>

                            Seleccione una prioridad

                        </option>


                        <option value="Baja">

                            Baja

                        </option>


                        <option value="Media">

                            Media

                        </option>


                        <option value="Alta">

                            Alta

                        </option>

                    </select>

                </div>


                <!-- ================================= -->
                <!-- TECNICO -->
                <!-- ================================= -->

                <div class="mb-4">

                    <label
                        for="idTecnico"
                        class="form-label">

                        Técnico

                    </label>

                    <select
                        id="idTecnico"
                        name="idTecnico"
                        class="form-select">


                        <option value="">

                            Sin técnico asignado

                        </option>


                        <option
                            th:each="tecnico : ${tecnicos}"
                            th:value="${tecnico.idTecnico}"
                            th:text="${tecnico.nombre
                                + ' '
                                + tecnico.apellidos
                                + ' - '
                                + tecnico.especialidad}">

                        </option>

                    </select>

                </div>


                <!-- ================================= -->
                <!-- BOTONES -->
                <!-- ================================= -->

                <div class="acciones">


                    <button
                        type="submit"
                        class="btn btn-guardar">

                        Crear solicitud

                    </button>


                    <a
                        th:href="@{/solicitud/listado}"
                        class="btn btn-regresar">

                        Cancelar

                    </a>


                </div>


            </form>


        </div>


    </div>


</div>


<style>

    body {

        margin: 0;

        min-height: 100vh;

        font-family:
            Arial,
            Helvetica,
            sans-serif;

        background:
            linear-gradient(
                135deg,
                #00a6d6,
                #0077b6,
                #004e89
            );

    }


    .navbar {

        background: white;

        padding: 18px 0;

        box-shadow:
            0 8px 25px
            rgba(0,0,0,.15);

    }


    .navbar-brand {

        font-size: 26px;

        font-weight: 900;

        color: #003b73;

    }


    .navbar-brand strong {

        color: #00a6d6;

    }


    .main-container {

        max-width: 850px;

        padding-top: 50px;

        padding-bottom: 50px;

    }


    .soporte-card {

        border: none;

        border-radius: 24px;

        overflow: hidden;

        box-shadow:
            0 20px 50px
            rgba(0,0,0,.25);

    }


    .card-header {

        background: #003b73;

        color: white;

        padding: 30px;

        border: none;

    }


    .card-header h2 {

        font-weight: 900;

        margin-bottom: 5px;

    }


    .card-header p {

        margin: 0;

        opacity: .85;

    }


    .card-body {

        padding: 35px;

    }


    .form-label {

        font-weight: 700;

        color: #16324f;

    }


    .form-control,
    .form-select {

        border-radius: 12px;

        padding: 12px;

    }


    .acciones {

        display: flex;

        gap: 12px;

        margin-top: 30px;

    }


    .btn-guardar {

        background: #0077b6;

        color: white;

        font-weight: 700;

        border-radius: 12px;

        padding: 11px 25px;

    }


    .btn-guardar:hover {

        background: #005f92;

        color: white;

    }


    .btn-regresar {

        background: #e9ecef;

        color: #16324f;

        font-weight: 700;

        border-radius: 12px;

        padding: 11px 25px;

    }

</style>


</body>

</html>
