<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - Soporte TECH</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="login-container">

    <div class="login-box">

        <div class="login-image">
            <img th:src="@{/img/soporte-login.png}" alt="Soporte Tienda TECH">
        </div>

        <div class="login-form">

            <h1>Soporte <span>TECH</span></h1>
            <p class="subtitle">Centro de soporte y acceso al sistema</p>

            <div th:if="${error}" class="alert alert-danger text-center">
                Usuario o contraseña incorrectos.
            </div>

            <form th:action="@{/login}" method="post">

                <div class="mb-3">
                    <label>Usuario</label>
                    <input type="text"
                           name="username"
                           class="form-control"
                           placeholder="Ingrese su usuario"
                           required>
                </div>

                <div class="mb-4">
                    <label>Contraseña</label>
                    <input type="password"
                           name="password"
                           class="form-control"
                           placeholder="Ingrese su contraseña"
                           required>
                </div>

                <button type="submit" class="btn btn-login w-100">
                    Ingresar
                </button>

                <a th:href="@{/registro}" class="btn btn-register w-100 mt-3">
                    Registrarse
                </a>

            </form>

        </div>

    </div>

</div>

<style>
    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #00a6d6, #0077b6, #004e89);
    }

    .login-container {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px;
    }

    .login-box {
        width: 100%;
        max-width: 1100px;
        min-height: 600px;
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        background: #ffffff;
        border-radius: 28px;
        overflow: hidden;
        box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
    }

    .login-image {
        background: linear-gradient(135deg, #5ddcff, #35b9e6, #1ca4d9);
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        padding: 35px;
    }

    .login-image img {
        width: 100%;
        max-width: 660px;
        height: auto;
        object-fit: contain;
        filter: drop-shadow(0 18px 25px rgba(0, 0, 0, 0.22));
    }

    .login-form {
        padding: 70px 55px;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .login-form h1 {
        font-size: 42px;
        font-weight: 900;
        color: #003b73;
        text-align: center;
        margin-bottom: 5px;
    }

    .login-form h1 span {
        color: #00a6d6;
    }

    .subtitle {
        text-align: center;
        color: #607d9b;
        margin-bottom: 35px;
        font-size: 16px;
    }

    label {
        font-weight: 700;
        color: #16324f;
        margin-bottom: 6px;
    }

    .form-control {
        height: 52px;
        border-radius: 14px;
        border: 1px solid #c9d8e6;
        padding-left: 15px;
        font-size: 15px;
    }

    .form-control:focus {
        border-color: #00a6d6;
        box-shadow: 0 0 0 0.20rem rgba(0, 166, 214, 0.18);
    }

    .btn-login {
        height: 52px;
        border-radius: 14px;
        background: linear-gradient(135deg, #0077b6, #00a6d6);
        color: white;
        font-weight: 800;
        border: none;
    }

    .btn-login:hover {
        color: white;
        opacity: 0.92;
    }

    .btn-register {
        height: 52px;
        border-radius: 14px;
        border: 2px solid #0077b6;
        color: #0077b6;
        font-weight: 800;
    }

    .btn-register:hover {
        background: #0077b6;
        color: white;
    }

    @media (max-width: 850px) {
        .login-box {
            grid-template-columns: 1fr;
        }

        .login-image {
            padding: 25px;
        }

        .login-form {
            padding: 40px 30px;
        }

        .login-form h1 {
            font-size: 34px;
        }
    }
</style>

</body>
</html>
