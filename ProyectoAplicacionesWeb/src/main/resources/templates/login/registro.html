<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Soporte TECH</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="registro-container">

    <div class="registro-box">

        <div class="registro-image">
            <img th:src="@{/img/soporte-login.png}" alt="Soporte Tienda TECH">
        </div>

        <div class="registro-form">

            <h1>Soporte <span>TECH</span></h1>
            <p class="subtitle">Crear cuenta de acceso</p>

            <form th:action="@{/guardarUsuario}" method="post">

                <div class="mb-3">
                    <label>Nombre completo</label>
                    <input type="text" name="nombre" class="form-control"
                           placeholder="Ingrese su nombre" required>
                </div>

                <div class="mb-3">
                    <label>Usuario</label>
                    <input type="text" name="username" class="form-control"
                           placeholder="Cree un usuario" required>
                </div>

                <div class="mb-3">
                    <label>Correo electrónico</label>
                    <input type="email" name="correo" class="form-control"
                           placeholder="Ingrese su correo" required>
                </div>

                <div class="mb-4">
                    <label>Contraseña</label>
                    <input type="password" name="password" class="form-control"
                           placeholder="Cree una contraseña" required>
                </div>

                <button type="submit" class="btn btn-register-main w-100">
                    Crear cuenta
                </button>

                <a th:href="@{/login}" class="btn btn-back w-100 mt-3">
                    Volver al login
                </a>

            </form>

        </div>

    </div>

</div>

<style>
    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #00a6d6, #0077b6, #004e89);
    }

    .registro-container {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px;
    }

    .registro-box {
        width: 100%;
        max-width: 1100px;
        min-height: 620px;
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        background: #ffffff;
        border-radius: 28px;
        overflow: hidden;
        box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
    }

    .registro-image {
        background: linear-gradient(135deg, #5ddcff, #35b9e6, #1ca4d9);
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        padding: 35px;
    }

    .registro-image img {
        width: 100%;
        max-width: 660px;
        height: auto;
        object-fit: contain;
        filter: drop-shadow(0 18px 25px rgba(0, 0, 0, 0.22));
    }

    .registro-form {
        padding: 55px;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .registro-form h1 {
        font-size: 42px;
        font-weight: 900;
        color: #003b73;
        text-align: center;
        margin-bottom: 5px;
    }

    .registro-form h1 span {
        color: #00a6d6;
    }

    .subtitle {
        text-align: center;
        color: #607d9b;
        margin-bottom: 28px;
        font-size: 16px;
    }

    label {
        font-weight: 700;
        color: #16324f;
        margin-bottom: 6px;
    }

    .form-control {
        height: 50px;
        border-radius: 14px;
        border: 1px solid #c9d8e6;
        padding-left: 15px;
        font-size: 15px;
    }

    .form-control:focus {
        border-color: #00a6d6;
        box-shadow: 0 0 0 0.20rem rgba(0, 166, 214, 0.18);
    }

    .btn-register-main {
        height: 52px;
        border-radius: 14px;
        background: linear-gradient(135deg, #0077b6, #00a6d6);
        color: white;
        font-weight: 800;
        border: none;
    }

    .btn-register-main:hover {
        color: white;
        opacity: 0.92;
    }

    .btn-back {
        height: 52px;
        border-radius: 14px;
        border: 2px solid #0077b6;
        color: #0077b6;
        font-weight: 800;
    }

    .btn-back:hover {
        background: #0077b6;
        color: white;
    }

    @media (max-width: 850px) {
        .registro-box {
            grid-template-columns: 1fr;
        }

        .registro-image {
            padding: 25px;
        }

        .registro-form {
            padding: 40px 30px;
        }

        .registro-form h1 {
            font-size: 34px;
        }
    }
</style>

</body>
</html>
