<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

    <head>

        <meta charset="UTF-8">

        <title>Cliente</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    </head>

    <body>

        <div class="container py-5">

            <div class="row justify-content-center">

                <div class="col-md-8">

                    <div class="card shadow">

                        <div class="card-header bg-primary text-white">

                            <h3 class="mb-0">

                                Cliente

                            </h3>

                        </div>

                        <div class="card-body">

                            <form th:action="@{/cliente/guardar}"
                                  th:object="${cliente}"
                                  method="post">

                                <input type="hidden"
                                       th:field="*{idCliente}">

                                <div class="mb-3">

                                    <label class="form-label">

                                        Nombre

                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           th:field="*{nombre}"
                                           required>

                                </div>

                                <div class="mb-3">

                                    <label class="form-label">

                                        Apellidos

                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           th:field="*{apellidos}"
                                           required>

                                </div>

                                <div class="mb-3">

                                    <label class="form-label">

                                        Correo

                                    </label>

                                    <input type="email"
                                           class="form-control"
                                           th:field="*{correo}"
                                           required>

                                </div>

                                <div class="mb-3">

                                    <label class="form-label">

                                        Teléfono

                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           th:field="*{telefono}">

                                </div>

                                <div class="mb-3">

                                    <label class="form-label">

                                        Dirección

                                    </label>

                                    <textarea class="form-control"
                                              rows="3"
                                              th:field="*{direccion}">

                                    </textarea>

                                </div>

                                <div class="form-check mb-4">

                                    <input class="form-check-input"
                                           type="checkbox"
                                           th:field="*{activo}">

                                    <label class="form-check-label">

                                        Activo

                                    </label>

                                </div>

                                <button class="btn btn-success">

                                    Guardar

                                </button>

                                <a th:href="@{/cliente/listado}"
                                   class="btn btn-secondary">

                                    Cancelar

                                </a>

                            </form>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </body>

</html>
