<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cliente - Soporte TECH</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow">

                <div class="card-header">
                    <h3 class="mb-0">
                        <i class="bi bi-person-vcard"></i> Cliente
                    </h3>
                </div>

                <div class="card-body">

                    <form th:action="@{/cliente/guardar}" th:object="${cliente}" method="post">

                        <input type="hidden" th:field="*{idCliente}">

                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" class="form-control" th:field="*{nombre}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Apellidos</label>
                            <input type="text" class="form-control" th:field="*{apellidos}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Correo</label>
                            <input type="email" class="form-control" th:field="*{correo}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Teléfono</label>
                            <input type="text" class="form-control" th:field="*{telefono}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Dirección</label>
                            <textarea class="form-control" rows="3" th:field="*{direccion}"></textarea>
                        </div>

                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" th:field="*{activo}">
                            <label class="form-check-label">Activo</label>
                        </div>

                        <button class="btn btn-success rounded-pill">
                            <i class="bi bi-save"></i> Guardar
                        </button>

                        <a th:href="@{/cliente/listado}" class="btn btn-outline-secondary rounded-pill">
                            <i class="bi bi-x-circle"></i> Cancelar
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<style>
    body {
        background: linear-gradient(135deg, #00a6d6, #0077b6, #004e89);
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
    }

    .card {
        border: none;
        border-radius: 24px;
        overflow: hidden;
    }

    .card-header {
        background: #003b73;
        color: white;
        padding: 22px;
    }

    .card-header h3 {
        font-weight: 900;
    }

    .card-body {
        padding: 35px;
    }

    .form-label {
        color: #003b73;
        font-weight: 700;
    }

    .form-control {
        border-radius: 14px;
    }

    .btn {
        font-weight: 700;
    }
</style>

</body>
</html>
