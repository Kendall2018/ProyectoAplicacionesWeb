<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

    <head>

        <meta charset="UTF-8">

        <title>Clientes - Soporte TECH</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    </head>

    <body>

        <div class="container py-5">

            <div class="d-flex justify-content-between align-items-center mb-4">

                <div>

                    <h2>Clientes</h2>

                    <p class="text-muted">

                        Total:
                        <span th:text="${totalClientes}"></span>

                    </p>

                </div>

                <div>

                    <a th:href="@{/inicio}"
                       class="btn btn-secondary">

                        Volver

                    </a>

                    <a th:href="@{/cliente/nuevo}"
                       class="btn btn-primary">

                        Nuevo Cliente

                    </a>

                </div>

            </div>

            <table class="table table-bordered table-hover align-middle">

                <thead class="table-primary">

                    <tr>

                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Apellidos</th>
                        <th>Correo</th>
                        <th>Teléfono</th>
                        <th>Activo</th>
                        <th>Acciones</th>

                    </tr>

                </thead>

                <tbody>

                    <tr th:each="cliente : ${clientes}">

                        <td th:text="${cliente.idCliente}"></td>

                        <td th:text="${cliente.nombre}"></td>

                        <td th:text="${cliente.apellidos}"></td>

                        <td th:text="${cliente.correo}"></td>

                        <td th:text="${cliente.telefono}"></td>

                        <td>

                            <span class="badge bg-success"
                                  th:if="${cliente.activo}">
                                Sí
                            </span>

                            <span class="badge bg-danger"
                                  th:unless="${cliente.activo}">
                                No
                            </span>

                        </td>

                        <td>

                            <a class="btn btn-warning btn-sm"
                               th:href="@{/cliente/modificar/{id}(id=${cliente.idCliente})}">

                                Editar

                            </a>

                            <a class="btn btn-danger btn-sm"
                               th:href="@{/cliente/eliminar/{id}(id=${cliente.idCliente})}">

                                Desactivar

                            </a>

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </body>

</html>
