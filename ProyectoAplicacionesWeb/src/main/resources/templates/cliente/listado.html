<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Clientes - Soporte TECH</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body>

<div class="container py-5">

    <div class="contenedor-principal">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>
                <h2><i class="bi bi-people-fill"></i> Clientes</h2>
                <p class="text-muted mb-0">
                    Total:
                    <span th:text="${totalClientes}"></span>
                </p>
            </div>

            <div>
                <a th:href="@{/inicio}" class="btn btn-outline-secondary rounded-pill">
                    <i class="bi bi-arrow-left-circle"></i> Volver al menú
                </a>

                <a th:href="@{/cliente/nuevo}" class="btn btn-primary rounded-pill">
                    <i class="bi bi-plus-circle"></i> Nuevo Cliente
                </a>
            </div>

        </div>

        <div class="table-responsive">

            <table class="table table-bordered table-hover align-middle">

                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Apellidos</th>
                    <th>Correo</th>
                    <th>Teléfono</th>
                    <th>Activo</th>
                    <th>Acciones</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="cliente : ${clientes}">

                    <td th:text="${cliente.idCliente}"></td>
                    <td th:text="${cliente.nombre}"></td>
                    <td th:text="${cliente.apellidos}"></td>
                    <td th:text="${cliente.correo}"></td>
                    <td th:text="${cliente.telefono}"></td>

                    <td>
                        <span class="badge bg-success rounded-pill" th:if="${cliente.activo}">
                            Activo
                        </span>

                        <span class="badge bg-danger rounded-pill" th:unless="${cliente.activo}">
                            Inactivo
                        </span>
                    </td>

                    <td>
                        <a class="btn btn-warning btn-sm rounded-pill"
                           th:href="@{/cliente/modificar/{id}(id=${cliente.idCliente})}">
                            <i class="bi bi-pencil-square"></i> Editar
                        </a>

                        <a class="btn btn-danger btn-sm rounded-pill"
                           th:href="@{/cliente/eliminar/{id}(id=${cliente.idCliente})}">
                            <i class="bi bi-x-circle"></i> Desactivar
                        </a>
                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<style>
    body {
        background: linear-gradient(135deg, #00a6d6, #0077b6, #004e89);
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
    }

    .contenedor-principal {
        background: #ffffff;
        border-radius: 24px;
        padding: 35px;
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.25);
    }

    h2 {
        color: #003b73;
        font-weight: 900;
    }

    .table {
        border-radius: 16px;
        overflow: hidden;
        background: white;
    }

    .table thead {
        background: #003b73;
        color: white;
    }

    .btn {
        font-weight: 700;
    }
</style>

</body>
</html>
