<!DOCTYPE html>

<html
    xmlns:th="http://www.thymeleaf.org"
    lang="es">


<head>


    <meta charset="UTF-8">


    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">


    <title>
        Técnico - Soporte TECH
    </title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">


</head>


<body>


<div class="container py-5">


    <div class="row justify-content-center">


        <div class="col-lg-8">


            <div class="card">


                <div class="card-header">


                    <h3 class="mb-0">


                        <i
                            class="
                                bi
                                bi-person-gear
                            ">
                        </i>


                        <span

                            th:text="
                            ${tecnico.idTecnico == null
                            ?
                            'Registrar técnico'
                            :
                            'Modificar técnico'}">

                            Técnico

                        </span>


                    </h3>


                </div>


                <div class="card-body">


                    <form

                        th:action="
                        @{/tecnico/guardar}"

                        th:object="${tecnico}"

                        method="post">


                        <!-- ID -->

                        <input
                            type="hidden"
                            th:field="*{idTecnico}">


                        <!-- NOMBRE -->

                        <div class="row">


                            <div class="col-md-6 mb-3">


                                <label class="form-label">

                                    Nombre

                                </label>


                                <input

                                    type="text"

                                    th:field="*{nombre}"

                                    class="form-control"

                                    maxlength="100"

                                    required>


                            </div>


                            <div class="col-md-6 mb-3">


                                <label class="form-label">

                                    Apellidos

                                </label>


                                <input

                                    type="text"

                                    th:field="*{apellidos}"

                                    class="form-control"

                                    maxlength="150"

                                    required>


                            </div>


                        </div>


                        <!-- ESPECIALIDAD -->

                        <div class="mb-3">


                            <label class="form-label">

                                Especialidad

                            </label>


                            <input

                                type="text"

                                th:field="*{especialidad}"

                                class="form-control"

                                placeholder="Ejemplo: Redes y conectividad"

                                maxlength="150"

                                required>


                        </div>


                        <!-- CORREO / TELEFONO -->

                        <div class="row">


                            <div class="col-md-7 mb-3">


                                <label class="form-label">

                                    Correo electrónico

                                </label>


                                <input

                                    type="email"

                                    th:field="*{correo}"

                                    class="form-control"

                                    maxlength="150"

                                    required>


                            </div>


                            <div class="col-md-5 mb-3">


                                <label class="form-label">

                                    Teléfono

                                </label>


                                <input

                                    type="text"

                                    th:field="*{telefono}"

                                    class="form-control"

                                    maxlength="20">


                            </div>


                        </div>


                        <!-- DESCRIPCION -->

                        <div class="mb-3">


                            <label class="form-label">

                                Descripción

                            </label>


                            <textarea

                                th:field="*{descripcion}"

                                class="form-control"

                                rows="4"

                                maxlength="500"

                                placeholder="Describa las funciones o especialidad del técnico.">
                            </textarea>


                        </div>


                        <!-- ACTIVO -->

                        <div class="form-check mb-4">


                            <input

                                type="checkbox"

                                th:field="*{activo}"

                                class="form-check-input">


                            <label class="form-check-label">

                                Técnico activo

                            </label>


                        </div>


                        <!-- BOTONES -->

                        <button

                            type="submit"

                            class="
                                btn
                                btn-success
                                rounded-pill
                            ">


                            <i
                                class="
                                    bi
                                    bi-floppy-fill
                                ">
                            </i>

                            Guardar


                        </button>


                        <a

                            th:href="
                            @{/tecnico/listado}"

                            class="
                                btn
                                btn-outline-secondary
                                rounded-pill
                            ">


                            Cancelar


                        </a>


                    </form>


                </div>


            </div>


        </div>


    </div>


</div>


<style>


    body {

        min-height: 100vh;

        background:
            linear-gradient(
                135deg,
                #00a6d6,
                #0077b6,
                #004e89
            );

    }


    .card {

        border: none;

        border-radius: 24px;

        overflow: hidden;

        box-shadow:
            0 18px 45px
            rgba(0,0,0,.25);

    }


    .card-header {

        background: #003b73;

        color: white;

        padding: 25px;

    }


    .card-header h3 {

        font-weight: 900;

    }


    .card-body {

        padding: 35px;

    }


    .form-label {

        color: #003b73;

        font-weight: 800;

    }


    .form-control {

        border-radius: 14px;

    }


    .btn {

        font-weight: 700;

    }


</style>


</body>

</html>
