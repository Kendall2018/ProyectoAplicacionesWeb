<!DOCTYPE html>

<html
    xmlns:th="http://www.thymeleaf.org"
    lang="es">


<head>


    <meta charset="UTF-8">


    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">


    <title>
        Contactar técnico
    </title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">


</head>


<body>


<div class="container py-5">


    <div class="row justify-content-center">


        <div class="col-lg-8">


            <div class="card">


                <!-- ENCABEZADO -->

                <div class="encabezado">


                    <h2>

                        <i
                            class="
                                bi
                                bi-envelope-paper-fill
                            ">
                        </i>

                        Solicitud de soporte

                    </h2>


                    <p>

                        Contacta directamente
                        con el técnico seleccionado.

                    </p>


                </div>


                <div class="card-body">


                    <!-- ================================= -->
                    <!-- EXITO -->
                    <!-- ================================= -->

                    <div
                        th:if="${exito}"

                        class="
                            alert
                            alert-success
                        ">


                        <i
                            class="
                                bi
                                bi-check-circle-fill
                            ">
                        </i>


                        <span
                            th:text="${exito}">
                        </span>


                    </div>


                    <!-- ================================= -->
                    <!-- ERROR -->
                    <!-- ================================= -->

                    <div
                        th:if="${error}"

                        class="
                            alert
                            alert-danger
                        ">


                        <i
                            class="
                                bi
                                bi-exclamation-triangle-fill
                            ">
                        </i>


                        <span
                            th:text="${error}">
                        </span>


                    </div>


                    <!-- ================================= -->
                    <!-- TECNICO -->
                    <!-- ================================= -->

                    <div class="tecnico mb-4">


                        <div class="icono">


                            <i
                                class="
                                    bi
                                    bi-person-gear
                                ">
                            </i>


                        </div>


                        <div>


                            <h4
                                th:text="
                                ${tecnico.nombre
                                + ' '
                                + tecnico.apellidos}">

                                Técnico

                            </h4>


                            <div
                                class="especialidad"

                                th:text="
                                ${tecnico.especialidad}">

                                Especialidad

                            </div>


                            <div class="correo">


                                <i
                                    class="
                                        bi
                                        bi-envelope-fill
                                    ">
                                </i>


                                <span
                                    th:text="
                                    ${tecnico.correo}">

                                    correo@gmail.com

                                </span>


                            </div>


                        </div>


                    </div>


                    <!-- ================================= -->
                    <!-- FORMULARIO -->
                    <!-- ================================= -->

                    <form

                        th:action="
                        @{/tecnico/enviarCorreo}"

                        method="post">


                        <!-- ID -->

                        <input
                            type="hidden"

                            name="idTecnico"

                            th:value="
                            ${tecnico.idTecnico}">


                        <!-- ASUNTO -->

                        <div class="mb-3">


                            <label
                                for="asunto"

                                class="form-label">

                                Asunto

                            </label>


                            <input

                                id="asunto"

                                name="asunto"

                                type="text"

                                class="form-control"

                                value="
Solicitud de soporte - Soporte TECH"

                                maxlength="150"

                                required>


                        </div>


                        <!-- MENSAJE -->

                        <div class="mb-4">


                            <label
                                for="mensaje"

                                class="form-label">

                                Descripción del problema

                            </label>


                            <textarea

                                id="mensaje"

                                name="mensaje"

                                class="form-control"

                                rows="8"

                                maxlength="2000"

                                placeholder="Describa detalladamente el inconveniente que presenta..."

                                required></textarea>


                            <div class="form-text">

                                Incluya toda la información
                                necesaria para que el técnico
                                pueda comprender el problema.

                            </div>


                        </div>


                        <div
                            class="
                                d-flex
                                gap-2
                                flex-wrap
                            ">


                            <button

                                type="submit"

                                class="
                                    btn
                                    btn-primary
                                    rounded-pill
                                ">


                                <i
                                    class="
                                        bi
                                        bi-send-fill
                                    ">
                                </i>

                                Enviar correo


                            </button>


                            <a

                                th:href="
                                @{/tecnico/listado}"

                                class="
                                    btn
                                    btn-outline-secondary
                                    rounded-pill
                                ">


                                <i
                                    class="
                                        bi
                                        bi-arrow-left
                                    ">
                                </i>

                                Volver


                            </a>


                        </div>


                    </form>


                </div>


            </div>


        </div>


    </div>


</div>


<style>


    body {

        min-height: 100vh;

        background:
            linear-gradient(
                135deg,
                #00a6d6,
                #0077b6,
                #004e89
            );

        font-family:
            Arial,
            Helvetica,
            sans-serif;

    }


    .card {

        border: none;

        border-radius: 25px;

        overflow: hidden;

        box-shadow:
            0 18px 45px
            rgba(0,0,0,.25);

    }


    .encabezado {

        padding: 30px;

        background:
            linear-gradient(
                135deg,
                #003b73,
                #0077b6
            );

        color: white;

    }


    .encabezado h2 {

        font-weight: 900;

    }


    .encabezado p {

        margin: 0;

        opacity: .9;

    }


    .card-body {

        padding: 35px;

    }


    .tecnico {

        display: flex;

        align-items: center;

        gap: 20px;

        padding: 22px;

        border-radius: 18px;

        background: #eef7fb;

    }


    .icono {

        width: 70px;

        height: 70px;

        flex-shrink: 0;

        border-radius: 20px;

        background:
            linear-gradient(
                135deg,
                #0077b6,
                #00a6d6
            );

        color: white;

        display: flex;

        justify-content: center;

        align-items: center;

        font-size: 33px;

    }


    .tecnico h4 {

        color: #003b73;

        font-weight: 900;

        margin-bottom: 3px;

    }


    .especialidad {

        color: #0077b6;

        font-weight: 800;

        margin-bottom: 5px;

    }


    .correo {

        color: #607d9b;

    }


    .form-label {

        color: #003b73;

        font-weight: 800;

    }


    .form-control {

        border-radius: 14px;

        padding: 12px;

    }


    textarea {

        resize: vertical;

    }


    .btn {

        font-weight: 800;

        padding:
            10px
            20px;

    }


</style>


</body>

</html>
