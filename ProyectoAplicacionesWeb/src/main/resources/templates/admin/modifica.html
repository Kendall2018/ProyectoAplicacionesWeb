<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <title>Admin - Modificar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
 <div class="container py-5">
 <div class="row justify-content-center">
 <div class="col-md-8">
 <div class="card border-0 rounded-4 shadow-sm">
 <div class="card-body p-5">
 <h3 class="fw-bold mb-4" th:text="${producto.idProducto!= null}? 'Editar Producto': 'Nuevo Producto'">
 Nuevo Producto
 </h3>

 <form th:action="@{/admin/producto/guardar}" method="post" th:object="${producto}">
 <input type="hidden" th:field="*{idProducto}" />

 <div class="mb-3">
 <label class="form-label">Nombre</label>
 <input type="text" class="form-control" th:field="*{nombre}" required />
 </div>
 
 <div class="mb-3">
 <label class="form-label">Marca</label>
 <input type="text" class="form-control" th:field="*{marca}" required />
 </div>

 <div class="mb-3">
 <label class="form-label">Descripción</label>
 <textarea class="form-control" rows="3" th:field="*{descripcion}" required></textarea>
 </div>

 <div class="row mb-3">
 <div class="col-md-6">
 <label class="form-label">Precio</label>
 <input type="number" step="0.01" class="form-control" th:field="*{precio}" required />
 </div>
 <div class="col-md-6">
 <label class="form-label">Existencias</label>
 <input type="number" class="form-control" th:field="*{existencias}" required />
 </div>
 </div>

 <div class="mb-3">
 <label class="form-label">Ruta de Imagen</label>
 <input type="text" class="form-control" th:field="*{rutaImagen}" />
 </div>

 <div class="mb-4">
 <label class="form-label">Categoría</label>
 <select class="form-select" th:field="*{categoria.idCategoria}" required>
 <option value="">Seleccione una categoría...</option>
 <option th:each="cat: ${categorias}"
 th:value="${cat.idCategoria}"
 th:text="${cat.nombre}">Categoría</option>
 </select>
 </div>

 <div class="d-flex gap-2">
 <button type="submit" class="btn btn-success rounded-pill px-4">
 <i class="bi bi-check-circle"></i>
 <span th:text="${producto.idProducto!= null}? 'Actualizar': 'Guardar'">Guardar</span>
 </button>
 <a th:href="@{/admin/producto/listado}" class="btn btn-secondary rounded-pill px-4">
 Cancelar
 </a>
 </div>
 </form>
 </div>
 </div>
 </div>
 </div>
 </div>
</body>
</html>
