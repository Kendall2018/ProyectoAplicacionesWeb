<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <title>Admin - Productos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
 <div class="container py-5">
 <div class="row">
 <div class="col-12 mb-4 d-flex justify-content-between align-items-center">
 <div>
 <h2>Gestión de Productos</h2>
 <p class="text-muted">Total: <span th:text="${#lists.size(productos)}">0</span> productos</p>
 </div>
 <a th:href="@{/admin/producto/nuevo}" class="btn btn-success rounded-pill px-4">
 <i class="bi bi-plus-circle"></i> Agregar Producto
 </a>
 </div>
 </div>

 <div class="row">
 <div class="col-md-4 mb-4" th:each="producto: ${productos}">
 <div class="card border-0 rounded-4 shadow-sm h-100">
 <div class="position-relative">
 <span class="badge bg-danger position-absolute top-0 start-0 m-3">Nuevo</span>
 <div class="overflow-hidden">
 <img th:src="${producto.rutaImagen}"
 class="card-img-top"
 th:alt="${producto.nombre}"
 style="height: 250px; object-fit: cover;" />
 </div>
 </div>
 <div class="card-body p-4 d-flex flex-column">
 <h5 class="card-title mb-3 fw-bold" th:text="${producto.nombre}">Producto</h5>
 <p class="card-text text-muted mb-4 flex-grow-1" th:text="${producto.descripcion}">Descripción</p>

 <div class="d-flex justify-content-between align-items-center mt-auto mb-3">
 <span class="fs-4 fw-bold text-success"
 th:text="'$' + ${#numbers.formatDecimal(producto.precio, 1, 2)}">$0.00</span>
 <span class="badge bg-secondary rounded-pill">
 <i class="bi bi-box"></i> <span th:text="${producto.existencias}">0</span>
 </span>
 </div>

 <small class="text-muted mb-3">
 <i class="bi bi-tag"></i>
 <span th:text="${producto.categoria.nombre}">General</span>
 </small>

 <div class="d-flex gap-2 mt-auto">
 <a th:href="@{'/admin/producto/editar/' + ${producto.idProducto}}"
 class="btn btn-warning btn-sm rounded-pill flex-fill">
 <i class="bi bi-pencil"></i> Editar
 </a>
 <a th:href="@{'/admin/producto/eliminar/' + ${producto.idProducto}}"
 class="btn btn-danger btn-sm rounded-pill flex-fill"
 th:onclick="'return confirm(\'¿Estás seguro de eliminar ' + __${producto.nombre}__ + '?\')'">
 <i class="bi bi-trash"></i> Eliminar
</a>
 </div>
 </div>
 </div>
 </div>
 </div>

 <div class="row" th:if="${#lists.isEmpty(productos)}">
 <div class="col-12 text-center py-5">
 <i class="bi bi-box-seam" style="font-size: 4rem; color: #ccc;"></i>
 <h4 class="text-muted mt-3">No hay productos registrados</h4>
 <a th:href="@{/admin/producto/nuevo}" class="btn btn-success rounded-pill mt-3">
 <i class="bi bi-plus-circle"></i> Agregar el primero
 </a>
 </div>
 </div>
 </div>
</body>
</html>
