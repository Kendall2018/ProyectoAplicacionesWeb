<!DOCTYPE html>

<html
    xmlns:th="http://www.thymeleaf.org"
    lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <title>
        Productos - Listado
    </title>

    <!-- ============================= -->
    <!-- TOKEN CSRF DE SPRING SECURITY -->
    <!-- ============================= -->

    <meta
        name="_csrf"
        th:content="${_csrf.token}"/>

    <meta
        name="_csrf_header"
        th:content="${_csrf.headerName}"/>

    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body class="bg-light">

<!-- ======================================== -->
<!-- BARRA SUPERIOR -->
<!-- ======================================== -->

<div class="container pt-4">

    <div
        class="d-flex justify-content-between
               align-items-center gap-2 mb-3
               flex-wrap">

        <!-- Volver -->

        <a
            th:href="@{/inicio}"
            class="btn btn-outline-secondary
                   rounded-pill">

            <i class="bi bi-arrow-left-circle"></i>

            Volver al menú

        </a>

        <div
            class="d-flex gap-2
                   align-items-center">

            <!-- ============================ -->
            <!-- RESUMEN DEL CARRITO -->
            <!-- ============================ -->

            <div
                th:replace=
                "~{carrito/fragmentos :: verCarrito}">
            </div>

            <!-- Panel administrativo -->

            <a
                th:href="@{/admin/listado}"
                class="btn btn-outline-primary
                       rounded-pill">

                <i class="bi bi-shield-lock"></i>

                Panel Admin

            </a>

        </div>

    </div>

</div>


<!-- ======================================== -->
<!-- LISTADO DE PRODUCTOS -->
<!-- ======================================== -->

<div class="container py-5">

    <div class="row">

        <div class="col-12 mb-4">

            <h2>
                Productos Disponibles
            </h2>

            <p class="text-muted">

                Total:

                <span
                    th:text="${#lists.size(productos)}">

                    0

                </span>

            </p>

        </div>

    </div>


    <div class="row">

        <!-- ===================================== -->
        <!-- RECORRER PRODUCTOS -->
        <!-- ===================================== -->

        <div
            class="col-md-4 mb-4"

            th:each="producto : ${productos}">


            <div
                class="card product-card border-0
                       rounded-4 shadow-sm h-100">


                <!-- Imagen -->

                <div class="position-relative">


                    <!-- Disponible -->

                    <span
                        th:if="${producto.existencias > 0}"

                        class="badge bg-success
                               position-absolute m-3">

                        Disponible

                    </span>


                    <!-- Agotado -->

                    <span
                        th:unless="${producto.existencias > 0}"

                        class="badge bg-danger
                               position-absolute m-3">

                        Agotado

                    </span>


                    <div class="overflow-hidden">

                        <img
                            th:src="${producto.rutaImagen}"

                            th:alt="${producto.nombre}"

                            class="card-img-top
                                   product-image"

                            style="
                                height:250px;
                                object-fit:cover;
                            "/>

                    </div>

                </div>


                <!-- ================================= -->
                <!-- INFORMACIÓN DEL PRODUCTO -->
                <!-- ================================= -->

                <div
                    class="card-body p-4
                           d-flex flex-column">


                    <h5
                        class="card-title mb-2 fw-bold"

                        th:text="${producto.nombre}">

                        Producto

                    </h5>


                    <!-- Marca -->

                    <div
                        class="small text-muted mb-2"

                        th:text="${producto.marca}">

                        Marca

                    </div>


                    <!-- Descripción -->

                    <p
                        class="card-text text-muted
                               mb-4 flex-grow-1"

                        th:text="${producto.descripcion}">

                        Descripción

                    </p>


                    <!-- ============================= -->
                    <!-- PRECIO + BOTÓN CARRITO -->
                    <!-- ============================= -->

                    <div
                        class="d-flex
                               justify-content-between
                               align-items-center
                               mt-auto gap-2">


                        <!-- Precio -->

                        <span
                            class="fs-5 fw-bold
                                   text-primary"

                            th:text="
                            '₡'
                            +
                            ${#numbers.formatDecimal(
                                producto.precio,
                                1,
                                'COMMA',
                                2,
                                'POINT'
                            )}">

                            ₡0.00

                        </span>


                        <!-- ====================== -->
                        <!-- AGREGAR AL CARRITO -->
                        <!-- ====================== -->

                        <button

                            type="button"

                            class="
                                btn btn-primary
                                px-3 py-2
                                rounded-pill
                            "

                            th:disabled="
                                ${producto.existencias <= 0}
                            "

                            th:onclick="
                                |addToCart(
                                ${producto.idProducto}
                                )|
                            ">

                            <i
                                class="
                                    bi bi-cart-plus
                                    me-1
                                ">
                            </i>

                            Agregar

                        </button>

                    </div>


                    <!-- ================================= -->
                    <!-- INFORMACIÓN EXTRA -->
                    <!-- ================================= -->

                    <small
                        class="text-muted mt-3">

                        Existencias:

                        <span
                            th:text="
                            ${producto.existencias}">

                            0

                        </span>

                        |

                        Categoría:

                        <span
                            th:text="
                            ${producto.categoria.nombre}">

                            General

                        </span>

                    </small>

                </div>

            </div>

        </div>

    </div>

</div>



<script
    th:src="@{/js/carrito.js}">
</script>

</body>

</html>
