 <!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <title>Productos - Listado</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
    <body>
        <div class="d-flex justify-content-end mb-3">
            <a th:href="@{/admin/listado}" class="btn btn-outline-primary rounded-pill">
            <i class="bi bi-shield-lock"></i> Panel Admin
            </a>
        </div>
        <div class="container py-5">
 <div class="row">
 <div class="col-12 mb-4">
 <h2>Productos Disponibles</h2>
 <p class="text-muted">Total: <span th:text="${#lists.size(productos)}">0</span></p>
 </div>
 </div>
 <div class="row">
 <div class="col-md-4 mb-4" th:each="producto: ${productos}">
 <div class="card product-card border-0 rounded-4 shadow-sm h-100">
 <div class="position-relative">
 <span class="badge bg-danger badge-custom">New Arrival</span>
 <div class="overflow-hidden">
 <img th:src="${producto.rutaImagen}"
 class="card-img-top product-image"
 th:alt="${producto.nombre}"
 style="height: 250px; object-fit: cover;" />
 </div>
 </div>
 <div class="card-body p-4 d-flex flex-column">
 <h5 class="card-title mb-3 fw-bold" th:text="${producto.nombre}">Premium Wireless Headphones</h5>
 <p class="card-text text-muted mb-4 flex-grow-1" th:text="${producto.descripcion}">Descripción</p>
 <div class="d-flex justify-content-between align-items-center mt-auto">
 <span class="price" th:text="'$' + ${#numbers.formatDecimal(producto.precio, 1, 2)}">$299.99</span>
 <button class="btn btn-custom text-white px-4 py-2 rounded-pill"
 th:onclick="'addToCart(' + ${producto.idProducto} + ')'">
 Add to Cart
 </button>
 </div>
 <small class="text-muted mt-2">
 existencias: <span th:text="${producto.existencias}">0</span> |
 Categoría: <span th:text="${producto.categoria.nombre}">General</span>
 </small>
 </div>
 </div>
 </div>
 </div>
</div>
    </body>
</html>
